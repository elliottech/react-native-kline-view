name: Command dispatch tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: node --experimental-vm-modules --test tests/*.test.cjs
